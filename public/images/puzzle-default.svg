<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Background Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>

    <!-- Hill Gradient -->
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="schoolRoof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="600" fill="url(#skyGrad)"/>

  <!-- Rainbow -->
  <g opacity="0.45">
    <ellipse cx="300" cy="400" rx="270" ry="240" fill="none" stroke="#ef4444" stroke-width="12"/>
    <ellipse cx="300" cy="400" rx="258" ry="228" fill="none" stroke="#f97316" stroke-width="12"/>
    <ellipse cx="300" cy="400" rx="246" ry="216" fill="none" stroke="#eab308" stroke-width="12"/>
    <ellipse cx="300" cy="400" rx="234" ry="204" fill="none" stroke="#22c55e" stroke-width="12"/>
    <ellipse cx="300" cy="400" rx="222" ry="192" fill="none" stroke="#06b6d4" stroke-width="12"/>
    <ellipse cx="300" cy="400" rx="210" ry="180" fill="none" stroke="#8b5cf6" stroke-width="12"/>
  </g>

  <!-- Sun -->
  <circle cx="90" cy="90" r="50" fill="url(#sunGlow)"/>
  <!-- Sun Rays -->
  <g stroke="#fde047" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="90" y1="25" x2="90" y2="10"/>
    <line x1="90" y1="155" x2="90" y2="170"/>
    <line x1="25" y1="90" x2="10" y2="90"/>
    <line x1="155" y1="90" x2="170" y2="90"/>
    <line x1="44" y1="44" x2="32" y2="32"/>
    <line x1="136" y1="136" x2="148" y2="148"/>
    <line x1="44" y1="136" x2="32" y2="148"/>
    <line x1="136" y1="44" x2="148" y2="32"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="160" cy="110" r="28"/>
    <circle cx="190" cy="98" r="35"/>
    <circle cx="230" cy="110" r="28"/>
    <rect x="160" y="105" width="70" height="32" rx="10"/>

    <circle cx="440" cy="130" r="24"/>
    <circle cx="470" cy="115" r="32"/>
    <circle cx="510" cy="130" r="26"/>
    <rect x="440" y="125" width="70" height="30" rx="10"/>
  </g>

  <!-- Birds -->
  <g stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 280 80 Q 290 70 300 80 Q 310 70 320 80"/>
    <path d="M 330 100 Q 338 92 346 100 Q 354 92 362 100"/>
    <path d="M 250 120 Q 257 114 264 120 Q 271 114 278 120"/>
  </g>

  <!-- Distant Hills -->
  <path d="M -50 420 Q 150 280 350 380 T 650 360 L 650 600 L -50 600 Z" fill="url(#hill2)"/>
  <path d="M -50 460 Q 200 360 420 440 T 650 420 L 650 600 L -50 600 Z" fill="url(#hill1)"/>

  <!-- School Building -->
  <g transform="translate(180, 270)">
    <!-- Main Wall -->
    <rect x="0" y="50" width="240" height="130" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" rx="4"/>
    <!-- Roof -->
    <polygon points="-15,50 120,-10 255,50" fill="url(#schoolRoof)"/>
    <!-- Clock Tower -->
    <rect x="95" y="-55" width="50" height="55" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="90,-55 120,-85 150,-55" fill="#b91c1c"/>
    <circle cx="120" cy="-30" r="14" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
    <line x1="120" y1="-30" x2="120" y2="-38" stroke="#0f172a" stroke-width="2"/>
    <line x1="120" y1="-30" x2="127" y2="-30" stroke="#0f172a" stroke-width="2"/>

    <!-- Indonesian Flag on Top -->
    <line x1="120" y1="-85" x2="120" y2="-115" stroke="#475569" stroke-width="3"/>
    <rect x="120" y="-115" width="28" height="10" fill="#dc2626"/>
    <rect x="120" y="-105" width="28" height="10" fill="#ffffff"/>

    <!-- School Front Sign -->
    <rect x="50" y="60" width="140" height="25" fill="#0d9488" rx="5"/>
    <text x="120" y="77" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RUANG CERITAKU</text>

    <!-- Windows -->
    <g fill="#bae6fd" stroke="#0284c7" stroke-width="2">
      <rect x="25" y="100" width="30" height="30" rx="3"/>
      <rect x="75" y="100" width="30" height="30" rx="3"/>
      <rect x="135" y="100" width="30" height="30" rx="3"/>
      <rect x="185" y="100" width="30" height="30" rx="3"/>
    </g>

    <!-- Main Door -->
    <path d="M 100 180 L 100 135 A 20 20 0 0 1 140 135 L 140 180 Z" fill="#92400e" stroke="#78350f" stroke-width="2"/>
    <line x1="120" y1="135" x2="120" y2="180" stroke="#78350f" stroke-width="2"/>
    <circle cx="114" cy="160" r="2.5" fill="#fef08a"/>
    <circle cx="126" cy="160" r="2.5" fill="#fef08a"/>
  </g>

  <!-- Big Tree on Left -->
  <g transform="translate(60, 290)">
    <!-- Trunk -->
    <path d="M 45 190 Q 55 120 40 70 Q 60 70 70 190 Z" fill="#78350f"/>
    <!-- Foliage Leaves -->
    <circle cx="50" cy="60" r="45" fill="#15803d"/>
    <circle cx="20" cy="50" r="35" fill="#22c55e"/>
    <circle cx="80" cy="50" r="38" fill="#16a34a"/>
    <circle cx="50" cy="15" r="40" fill="#4ade80"/>
    <!-- Apples / Flowers -->
    <circle cx="35" cy="40" r="6" fill="#ef4444"/>
    <circle cx="65" cy="55" r="6" fill="#ef4444"/>
    <circle cx="50" cy="25" r="6" fill="#ef4444"/>
    <circle cx="75" cy="30" r="6" fill="#ef4444"/>
  </g>

  <!-- Cheerful Characters (Students & BK Teacher) -->
  <!-- Student 1: Boy reading -->
  <g transform="translate(130, 470)">
    <!-- Body -->
    <rect x="-12" y="25" width="24" height="35" fill="#0284c7" rx="5"/>
    <!-- Head -->
    <circle cx="0" cy="12" r="15" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M -15 10 Q 0 -5 15 10 Q 10 -2 -15 10 Z" fill="#1e293b"/>
    <!-- Smile -->
    <circle cx="-4" cy="10" r="2" fill="#0f172a"/>
    <circle cx="4" cy="10" r="2" fill="#0f172a"/>
    <path d="M -4 16 Q 0 20 4 16" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Book -->
    <polygon points="-16,42 0,38 16,42 14,58 0,54 -14,58" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Student 2: Girl waving with ribbon -->
  <g transform="translate(470, 460)">
    <!-- Body -->
    <polygon points="0,25 -18,65 18,65" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="14" fill="#fed7aa"/>
    <!-- Hair with Ponytail -->
    <path d="M -14 10 Q 0 -6 14 10 Q 10 -3 -14 10 Z" fill="#78350f"/>
    <circle cx="16" cy="2" r="6" fill="#ec4899"/>
    <path d="M 16 4 Q 28 8 26 22" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <!-- Face -->
    <circle cx="-4" cy="9" r="2" fill="#0f172a"/>
    <circle cx="4" cy="9" r="2" fill="#0f172a"/>
    <path d="M -4 15 Q 0 19 4 15" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Waving Arm -->
    <path d="M 12 30 Q 24 15 28 6" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Forefront Flowers & Grass Details -->
  <g fill="#ec4899">
    <circle cx="280" cy="540" r="7"/>
    <circle cx="310" cy="555" r="8"/>
    <circle cx="350" cy="535" r="7"/>
    <circle cx="410" cy="548" r="9"/>
    <circle cx="100" cy="550" r="8"/>
    <circle cx="220" cy="565" r="7"/>
  </g>
  <g fill="#facc15">
    <circle cx="280" cy="540" r="3"/>
    <circle cx="310" cy="555" r="3.5"/>
    <circle cx="350" cy="535" r="3"/>
    <circle cx="410" cy="548" r="4"/>
    <circle cx="100" cy="550" r="3.5"/>
    <circle cx="220" cy="565" r="3"/>
  </g>

  <!-- Motivational Banner Bottom Ribbon -->
  <g transform="translate(300, 565)">
    <rect x="-240" y="-18" width="480" height="36" fill="#0d9488" rx="18" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="6" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      PUZZLE GAMBAR 5X5 &bull; ASAH FOKUS &amp; KREATIF
    </text>
  </g>
</svg>
